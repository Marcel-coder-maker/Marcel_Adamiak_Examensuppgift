<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
   <link rel="stylesheet" href="css/style.css">
</head>
<body>
       <div id="keyboard-container">   
         <div id="first-row">
           <div id="escape"><h2>ESP</h2></div>
           <div id="f1"><h2>F1</h2></div>
           <div id="f2"><h2>F2</h2></div>
           <div id="f3"><h2>f3</h2></div>
           <div id="f4"><h2>f4</h2></div>
           <div id="f5"><h2>f5</h2></div>
           <div id="f6"><h2>f6</h2></div>
           <div id="f7"><h2>f7</h2></div>
           <div id="f8"><h2>f8</h2></div>
           <div id="f9"><h2>f9</h2></div>
           <div id="f10"><h2>f10</h2></div> 
           <div id="f11"><h2>f11</h2></div>
           <div id="f12"><h2>f12</h2></div>
         </div>
         
         <div id="second-row">
        <div id="backtick"><h2>§</h2></div>
        <div id="one"><h2>1</h2></div>
        <div id="two"><h2>2</h2></div>
        <div id="three"><h2>3</h2></div>
        <div id="fore"><h2>4</h2></div>
        <div id="five"><h2>5</h2></div>
        <div id="six"><h2>6</h2></div>
        <div id="seven"><h2>7</h2></div>
        <div id="eight"><h2>8</h2></div>
        <div id="nine"><h2>9</h2></div>
        <div id="zero"><h2>0</h2></div>
        <div id="question-mark"><h2>?</h2></div>
        <div id="arrow-left"><h2>←</h2></div>
         </div>
                  <div id="third-row">
              <div id="tab"><h2>Tab</h2></div>
              <div id="q"><h2>Q</h2></div>
              <div id="w"><h2>W</h2></div>
              <div id="e"><h2>E</h2></div>
              <div id="r"><h2>R</h2></div>
              <div id="t"><h2>T</h2></div>
              <div id="y"><h2>Y</h2></div>
              <div id="u"><h2>U</h2></div>
              <div id="i"><h2>I</h2></div>
              <div id="o"><h2>O</h2></div>
              <div id="p"><h2>p</h2></div>
              <div id="enter"><h2>Enter</h2></div>

                </div>
               
              <div id="forth-row"> 
               <div id="capslock"><h2>CAPS</h2></div>
               <div id="a"><h2>A</h2></div>
               <div id="s"><h2>S</h2></div>
               <div id="d"><h2>D</h2></div>
               <div id="f"><h2>F</h2></div>
               <div id="g"><h2>G</h2></div>
               <div id="h"><h2>H</h2></div>
               <div id="j"><h2>J</h2></div>
               <div id="k"><h2>K</h2></div>
               <div id="l"><h2>L</h2></div>
               <div id="star"><h2>*</h2></div>

               </div>

               <div id="fifth-row">
              <div id="greater"><h2>></h2></div>
              <div id="z"><h2>Z</h2></div>
              <div id="x"><h2>X</h2></div>
              <div id="c"><h2>C</h2></div>
              <div id="v"><h2>V</h2></div>
              <div id="b"><h2>B</h2></div>
              <div id="n"><h2>N</h2></div>
              <div id="m"><h2>M</h2></div>
              <div id="minus"><h2>-</h2></div>
               </div>

               <div id="sisth-row">
                <div id="ctrl"><h2>CTRL</h2></div>
                <div id="fn"><h2>FN</h2></div>
                <div id="alt"><h2>ALT</h2></div>
                <div id="space"><h2>Space</h2></div>
                <div id="alt-gr"><h2>Alt gr</h2></div>
               </div>
                
      </div>



  <script src="JS/script.js"></script>
</body>
</html>
